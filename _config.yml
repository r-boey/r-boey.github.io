# Site configuration
title: Ryan-Ashleigh Boey
author: Ryan-Ashleigh Boey
email: ryanboey20@gmail.com
description: >-
  PhD Student in English
  King's College London

url: "https://r-boey.github.io"
baseurl: ""

# Build settings
theme: minima
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-paginate-v2

# Markdown
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

# Collections for academic content
collections:
  publications:
    output: true
    permalink: /publications/:path/
  cv:
    output: true
    permalink: /cv/:path/

# Exclude from build
exclude:
  - vendor/
  - Gemfile
  - Gemfile.lock
